<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Request a demo · Rounds</title>
    <meta name="description" content="Ask for a Rounds demo or a pilot at your medical school." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Request a Rounds demo" />
    <meta property="og:description" content="Virtual patients that stick to the story faculty approved." />
    <meta property="og:url" content="https://rounds-app.github.io/rounds-landing/request-demo.html" />
    <meta property="og:image" content="https://rounds-app.github.io/rounds-landing/assets/rounds-demo-poster.jpg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero hero-short">
      <a class="wordmark wordmark-small reveal" href="index.html" aria-label="Rounds home">
        <span aria-hidden="true">R</span><svg class="disc" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffcf7f" />
              <stop offset="0.5" stop-color="#ff9466" />
              <stop offset="0.8" stop-color="#ef8aa0" />
            </linearGradient>
            <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a888dc" />
              <stop offset="0.45" stop-color="#6f6fd0" />
              <stop offset="1" stop-color="#3550a8" />
            </linearGradient>
            <clipPath id="clip"><circle cx="50" cy="50" r="50" /></clipPath>
          </defs>
          <g clip-path="url(#clip)">
            <rect width="100" height="100" fill="url(#sky)" />
            <path d="M0 62 C 22 54, 38 48, 58 47 S 88 52, 100 56 V100 H0Z" fill="url(#hill)" />
          </g>
        </svg><span aria-hidden="true">unds</span>
      </a>
      <h1 class="tagline reveal" style="--d: 120ms">Request a demo</h1>
      <p class="intro reveal" style="--d: 200ms">Tell us a little about your school. We&rsquo;ll set up a call and walk you through building a case and a student visit.</p>
    </header>

    <main class="sheet">
      <!-- TODO: this site is static, so the form opens the visitor's email app with the details filled in.
           Point it at a real form endpoint (and drop the mailto script) to collect requests without an email app. -->
      <form class="demo-form card-panel reveal" style="--d: 280ms" id="demo-form" action="mailto:contact@roundshealth.org" method="post" enctype="text/plain">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="institution">School or organization</label>
          <input id="institution" name="institution" type="text" autocomplete="organization" required />
        </div>
        <div class="field">
          <label for="role">Your role</label>
          <select id="role" name="role" required>
            <option value="" selected disabled>Choose one</option>
            <option>Dean or administrator</option>
            <option>Faculty</option>
            <option>Simulation or SP program staff</option>
            <option>Investor</option>
            <option>Student</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Anything you&rsquo;d like us to know <span class="optional">(optional)</span></label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>
        <button class="cta" type="submit">Write the email <span class="arrow" aria-hidden="true">&rarr;</span></button>
        <p class="form-note" id="form-note" role="status">This opens your email app with a message to contact@roundshealth.org. Nothing is sent until you press send there.</p>
      </form>

      <footer class="reveal" style="--d: 400ms"><a href="index.html">Back to Rounds</a> &middot; &copy; 2026 Rounds</footer>
    </main>

    <script>
      // Build the email ourselves so the body reads cleanly; the form's own mailto action is the no-JS fallback.
      document.getElementById("demo-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;
        const value = (name) => form.elements[name].value.trim();
        const subject = `Demo request: ${value("institution")}`;
        const body = [
          `Name: ${value("name")}`,
          `Email: ${value("email")}`,
          `School or organization: ${value("institution")}`,
          `Role: ${value("role")}`,
          "",
          value("message"),
        ].join("\n");
        window.location.href = `mailto:contact@roundshealth.org?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        document.getElementById("form-note").innerHTML =
          'Your email app should now have the message ready to send. If nothing opened, email us at <a href="mailto:contact@roundshealth.org">contact@roundshealth.org</a>.';
      });
    </script>
  </body>
</html>
